name: Hermes PHI Canary
description: >-
  Zero-PHI-egress synthetic PHI canary tests for HIPAA-regulated CI/CD pipelines.
  Verifies all 16 HIPAA Safe Harbor scrubber categories and writes a tamper-evident
  signed receipt per run. Pro tier adds drift detection and scheduled cron execution.
branding:
  icon: shield
  color: green

inputs:
  license-key:
    description: Keygen.sh license key for Hermes Canary Pro (KEYGEN_LICENSE_KEY secret). Required for Pro features.
    required: false
    default: ''
  signing-key:
    description: 32-byte hex signing key for receipt HMAC-SHA256 (HERMES_SIGNING_KEY secret). Required — generate with `openssl rand -hex 32`.
    required: true
  sentry-dsn:
    description: Optional Sentry DSN. The harness performs local pre-egress scrubber verification only; no data is sent to Sentry.
    required: false
    default: ''
  ruleset:
    description: Scrubber ruleset identifier.
    required: false
    default: hipaa-safe-harbor-16
  schedule:
    description: Cron expression for scheduled runs (e.g. '0 6 * * 1'). Recorded in the receipt for audit trail.
    required: false
    default: ''
  baseline-receipt:
    description: Path to a prior hermes-canary-receipt-*.json for drift detection. Download from a previous run artifact.
    required: false
    default: ''
  fail-on-drift:
    description: Exit non-zero when scrubber drift is detected against the baseline receipt.
    required: false
    default: 'false'
  fail-on-leak:
    description: Exit non-zero when any PHI canary token survives scrubbing. Default false (observer mode — receipt is always emitted).
    required: false
    default: 'false'
  output-dir:
    description: Directory where the signed JSON receipt is written.
    required: false
    default: ./hermes-evidence
  output-format:
    description: Receipt output format — 'json', 'summary', or 'both'.
    required: false
    default: json
  post-comment:
    description: Post a pass/fail summary comment to the pull request. Requires pull-requests:write permission.
    required: false
    default: 'true'

outputs:
  status:
    description: Overall canary outcome (PASSED or FAILED).
    value: ${{ steps.hermes-canary.outputs.status }}
  receipt-path:
    description: Local filesystem path to the signed JSON receipt.
    value: ${{ steps.hermes-canary.outputs.receipt-path }}
  receipt:
    description: Base64-encoded signed receipt JSON for downstream GRC gates.
    value: ${{ steps.hermes-canary.outputs.receipt }}
  drift-detected:
    description: Whether scrubber drift was detected against the baseline receipt (true/false).
    value: ${{ steps.hermes-canary.outputs.drift-detected }}
  comment-url:
    description: URL of the pull request comment posted by Hermes, if any.
    value: ${{ steps.hermes-canary.outputs.comment-url }}
  license-status:
    description: Keygen license validation result (valid, invalid, or free-tier).
    value: ${{ steps.hermes-canary.outputs.license-status }}

runs:
  using: composite
  steps:
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: pip install --quiet -r "${{ github.action_path }}/requirements.txt"

    - name: Run Hermes PHI canary harness
      id: hermes-canary
      shell: bash
      env:
        LICENSE_KEY: ${{ inputs.license-key }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        SENTRY_DSN: ${{ inputs.sentry-dsn }}
        RULESET: ${{ inputs.ruleset }}
        SCHEDULE: ${{ inputs.schedule }}
        BASELINE_RECEIPT: ${{ inputs.baseline-receipt }}
        FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        FAIL_ON_LEAK: ${{ inputs.fail-on-leak }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        POST_COMMENT: ${{ inputs.post-comment }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python "${{ github.action_path }}/entrypoint.py"
